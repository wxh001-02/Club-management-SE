<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发布活动 - 社团管理系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header class="navbar">
            <h1>社团管理系统</h1>
            <nav>
                <a href="/static/index.html" class="nav-link">首页</a>
                <a href="/static/activity-list.html" class="nav-link">活动</a>
            </nav>
            <div class="user-area">
                <span id="navUsername" class="hidden"></span>
                <button id="navLogout" onclick="logout()" class="btn btn-sm hidden">退出</button>
            </div>
        </header>

        <main>
            <section class="form-section">
                <h2>发布活动</h2>
                <form id="activityForm" onsubmit="handleSubmit(event)">
                    <div class="form-group">
                        <label for="clubId">所属社团 <span class="required">*</span></label>
                        <select id="clubId" class="form-control" required>
                            <option value="">请选择社团</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="title">活动标题 <span class="required">*</span></label>
                        <input type="text" id="title" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="content">活动内容 <span class="required">*</span></label>
                        <textarea id="content" class="form-control" rows="6" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="location">活动地点 <span class="required">*</span></label>
                        <input type="text" id="location" class="form-control" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="startTime">开始时间 <span class="required">*</span></label>
                            <input type="datetime-local" id="startTime" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label for="endTime">结束时间 <span class="required">*</span></label>
                            <input type="datetime-local" id="endTime" class="form-control" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="maxParticipants">最大参与人数</label>
                        <input type="number" id="maxParticipants" class="form-control" min="1" placeholder="不填则表示不限">
                    </div>
                    <div id="formError" class="error-msg hidden"></div>
                    <div class="form-actions">
                        <a href="/static/activity-list.html" class="btn">取消</a>
                        <button type="submit" class="btn btn-primary">发布活动</button>
                    </div>
                </form>
            </section>
        </main>
    </div>

    <script src="/static/js/common.js"></script>
    <script>
        function updateNav() {
            const user = getUser();
            if (!user) { window.location.href = '/static/login.html'; return; }
            document.getElementById('navUsername').textContent = user.username;
            document.getElementById('navUsername').classList.remove('hidden');
            document.getElementById('navLogout').classList.remove('hidden');
        }

        async function loadMyClubs() {
            const user = getUser();
            try {
                const res = await fetch('/api/club/my', { credentials: 'include' });
                const data = await res.json();
                const select = document.getElementById('clubId');
                if (data.code === 200 && data.data.length > 0) {
                    data.data.forEach(c => {
                        select.innerHTML += '<option value="' + c.id + '">' + escapeHtml(c.name) + '</option>';
                    });
                } else {
                    select.innerHTML += '<option value="" disabled>暂无管理的社团</option>';
                }
            } catch (e) {}
        }

        async function handleSubmit(e) {
            e.preventDefault();
            const errorDiv = document.getElementById('formError');
            errorDiv.classList.add('hidden');

            const activity = {
                clubId: parseInt(document.getElementById('clubId').value),
                title: document.getElementById('title').value,
                content: document.getElementById('content').value,
                location: document.getElementById('location').value,
                startTime: document.getElementById('startTime').value,
                endTime: document.getElementById('endTime').value,
                maxParticipants: document.getElementById('maxParticipants').value || null
            };

            if (!activity.clubId) {
                errorDiv.textContent = '请选择所属社团';
                errorDiv.classList.remove('hidden');
                return;
            }

            try {
                const res = await fetch('/api/activity', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(activity)
                });
                const data = await res.json();
                if (data.code === 200) {
                    window.location.href = '/static/activity-detail.html?id=' + data.data.id;
                } else {
                    errorDiv.textContent = data.msg;
                    errorDiv.classList.remove('hidden');
                }
            } catch (err) {
                errorDiv.textContent = '网络错误';
                errorDiv.classList.remove('hidden');
            }
        }

        updateNav();
        loadMyClubs();
    </script>
</body>
</html>
