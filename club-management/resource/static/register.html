<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 社团管理系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h1>社团管理系统</h1>
            <div class="auth-tabs">
                <a href="/static/login.html" class="tab-btn">登录</a>
                <a href="/static/register.html" class="tab-btn active">注册</a>
            </div>
            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" class="form-control" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" class="form-control" required autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">确认密码</label>
                    <input type="password" id="confirmPassword" class="form-control" required>
                </div>
                <div id="registerError" class="error-msg hidden"></div>
                <div id="registerSuccess" class="success-msg hidden"></div>
                <button type="submit" class="btn btn-primary btn-block">注册</button>
            </form>
        </div>
    </div>
    <script src="/static/js/common.js"></script>
    <script>
        async function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorDiv = document.getElementById('registerError');
            const successDiv = document.getElementById('registerSuccess');

            errorDiv.classList.add('hidden');
            successDiv.classList.add('hidden');

            if (password !== confirmPassword) {
                errorDiv.textContent = '两次密码输入不一致';
                errorDiv.classList.remove('hidden');
                return;
            }

            try {
                const res = await fetch('/api/user/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, role: 'MEMBER' })
                });
                const data = await res.json();
                if (data.code === 200) {
                    successDiv.textContent = '注册成功！即将跳转登录页...';
                    successDiv.classList.remove('hidden');
                    setTimeout(() => { window.location.href = '/static/login.html'; }, 1500);
                } else {
                    errorDiv.textContent = data.msg;
                    errorDiv.classList.remove('hidden');
                }
            } catch (err) {
                errorDiv.textContent = '网络错误，请稍后重试';
                errorDiv.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
