<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活动列表 - 社团管理系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header class="navbar">
            <h1>社团管理系统</h1>
            <nav>
                <a href="/static/index.html" class="nav-link">首页</a>
                <a href="/static/club-list.html" class="nav-link">社团</a>
                <a href="/static/activity-list.html" class="nav-link active">活动</a>
                <a href="/static/check-in.html" class="nav-link">签到</a>
            </nav>
            <div class="user-area">
                <span id="navUsername" class="hidden"></span>
                <a href="/static/login.html" id="navLogin" class="btn btn-sm">登录</a>
                <button id="navLogout" onclick="logout()" class="btn btn-sm hidden">退出</button>
            </div>
        </header>

        <main>
            <section class="section">
                <div class="section-header">
                    <h2>活动列表</h2>
                    <a href="/static/activity-form.html" class="btn btn-primary" id="createActivityBtn" style="display:none">发布活动</a>
                </div>
                <div class="filter-bar">
                    <select id="clubFilter" onchange="filterByClub()">
                        <option value="">全部社团</option>
                    </select>
                </div>
                <div id="activityList" class="card-grid">
                    <p class="loading">加载中...</p>
                </div>
            </section>
        </main>
    </div>

    <script src="/static/js/common.js"></script>
    <script>
        async function loadClubs() {
            const res = await fetch('/api/club');
            const data = await res.json();
            const select = document.getElementById('clubFilter');
            if (data.code === 200) {
                data.data.forEach(c => {
                    select.innerHTML += '<option value="' + c.id + '">' + escapeHtml(c.name) + '</option>';
                });
            }
        }

        async function loadActivities(clubId) {
            const url = clubId ? '/api/activity/club/' + clubId : '/api/activity';
            const res = await fetch(url);
            const data = await res.json();
            const div = document.getElementById('activityList');
            if (data.code === 200 && data.data.length > 0) {
                div.innerHTML = data.data.map(a =>
                    '<div class="card">' +
                    '<h4>' + escapeHtml(a.title) + '</h4>' +
                    '<p><strong>社团：</strong>' + escapeHtml(a.clubName || '') + '</p>' +
                    '<p><strong>地点：</strong>' + escapeHtml(a.location || '') + '</p>' +
                    '<p><strong>时间：</strong>' + formatTime(a.startTime) + ' ~ ' + formatTime(a.endTime) + '</p>' +
                    '<p><strong>人数：</strong>' + (a.currentParticipants || 0) + '/' + (a.maxParticipants || '不限') + '</p>' +
                    '<a href="/static/activity-detail.html?id=' + a.id + '" class="btn btn-sm">查看详情</a>' +
                    '</div>'
                ).join('');
            } else {
                div.innerHTML = '<p>暂无活动</p>';
            }
        }

        function filterByClub() {
            const clubId = document.getElementById('clubFilter').value;
            loadActivities(clubId);
        }

        function updateNav() {
            const user = getUser();
            if (user) {
                document.getElementById('navUsername').textContent = user.username;
                document.getElementById('navUsername').classList.remove('hidden');
                document.getElementById('navLogin').classList.add('hidden');
                document.getElementById('navLogout').classList.remove('hidden');
                if (user.role === 'PRESIDENT' || user.role === 'ADMIN') {
                    document.getElementById('createActivityBtn').style.display = '';
                }
            }
        }

        updateNav();
        loadClubs();
        loadActivities();
    </script>
</body>
</html>
